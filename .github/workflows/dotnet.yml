name: .NET Build & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build todos os projetos
        run: |
          PROJETOS=$(find . -name "*.csproj" -not -path "*/bin/*" -not -path "*/obj/*")
          if [ -z "$PROJETOS" ]; then
            echo "Nenhum .csproj encontrado ainda — pulando build."
            exit 0
          fi
          for proj in $PROJETOS; do
            echo ">>> Buildando: $proj"
            dotnet build "$proj" --configuration Release
          done

      - name: Rodar testes
        run: |
          TESTES=""
          while IFS= read -r proj; do
            if grep -qE "xunit|MSTest|NUnit" "$proj" 2>/dev/null; then
              TESTES="$TESTES $proj"
            fi
          done < <(find . -name "*.csproj" -not -path "*/bin/*" -not -path "*/obj/*")

          if [ -z "$TESTES" ]; then
            echo "Nenhum projeto de teste encontrado ainda — pulando testes."
            exit 0
          fi

          for proj in $TESTES; do
            echo ">>> Testando: $proj"
            dotnet test "$proj" --configuration Release --verbosity normal
          done